server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the content-hashed build assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA history-mode fallback — every route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
